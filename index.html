<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>作业云服务器 · 16 周作业板</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%9A%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ================= 登录 / 初始化 ================= -->
<div id="gate" class="gate" hidden>
  <div class="gate-card">
    <div class="gate-logo">📚</div>
    <h1 id="gate-title">作业云服务器</h1>
    <p id="gate-sub" class="gate-sub">输入口令，开始记录每周作业</p>

    <form id="gate-form" autocomplete="off">
      <div id="gate-setup-only" hidden>
        <label class="field">
          <span>设置访问口令（至少 4 位，告诉同组同学）</span>
          <input id="gate-newpass" type="password" placeholder="例如：hw2025" autocomplete="new-password">
        </label>
      </div>

      <div id="gate-passcode-only">
        <label class="field">
          <span>访问口令</span>
          <input id="gate-pass" type="password" placeholder="小组口令" autocomplete="current-password">
        </label>
      </div>

      <label class="field">
        <span>你的昵称（用于记录谁交了作业）</span>
        <input id="gate-nick" type="text" maxlength="24" placeholder="例如：小张" autocomplete="nickname">
      </label>

      <div id="gate-members" class="gate-members" hidden>
        <div class="gate-members-label">或者直接选择你之前用过的昵称</div>
        <div id="gate-members-list" class="chips"></div>
      </div>

      <div id="gate-error" class="gate-error" hidden></div>
      <button id="gate-submit" class="btn btn-primary btn-block" type="submit">进入作业板</button>
    </form>

    <p class="gate-foot">
      <span id="gate-hint">口令由第一位进入的人设置，之后所有同学共用。</span>
    </p>
  </div>
</div>

<!-- ================= 主界面 ================= -->
<div id="app" class="app" hidden>

  <header class="topbar">
    <button id="btn-menu" class="btn btn-ghost only-mobile" title="筛选面板">☰</button>
    <div class="brand">
      <span class="brand-logo">📚</span>
      <span>
        <b id="brand-title">本学期作业板</b>
        <small id="brand-semester">共 16 周</small>
      </span>
    </div>

    <div class="search-wrap">
      <input id="search" type="search" placeholder="搜索作业 / 课程 / 说明…">
      <span id="search-clear" class="search-clear" hidden>×</span>
    </div>

    <nav class="topbar-actions">
      <button id="btn-add" class="btn btn-primary" title="新增作业（快捷键 N）">＋ 新增作业</button>
      <button id="btn-major" class="btn btn-major" title="新增大作业">★ 大作业</button>
      <button id="btn-schedule" class="btn" title="编辑课表">🗓 课表</button>
      <button id="btn-undo" class="btn btn-ghost" title="撤销（Ctrl+Z）" disabled>↺</button>
      <button id="btn-redo" class="btn btn-ghost" title="重做（Ctrl+Shift+Z）" disabled>↻</button>
      <button id="btn-sync" class="btn btn-ghost" title="立即同步">⟳</button>
      <button id="btn-settings" class="btn btn-ghost" title="设置">⚙</button>
    </nav>
  </header>

  <div class="view-switch">
    <button class="seg" data-view="grid" aria-pressed="true">16 周总览</button>
    <button class="seg" data-view="list" aria-pressed="false">清单模式</button>
    <button class="seg" data-view="timetable" aria-pressed="false">课程表</button>
    <span class="spacer"></span>
    <span id="sync-state" class="sync-state">已就绪</span>
  </div>

  <div id="banner" class="banner" hidden></div>

  <div class="layout">
    <!-- 侧栏 -->
    <aside id="sidebar" class="sidebar">
      <section class="panel">
        <h3>进度</h3>
        <div id="progress-box" class="progress-box"></div>
      </section>

      <section class="panel">
        <h3>课程筛选 <button id="btn-clear-filter" class="link-btn">全部</button></h3>
        <div id="course-filter" class="chips"></div>
      </section>

      <section class="panel">
        <h3>状态</h3>
        <div id="state-filter" class="chips">
          <button class="chip" data-state="all">全部</button>
          <button class="chip" data-state="todo">未完成</button>
          <button class="chip" data-state="done">已完成</button>
          <button class="chip" data-state="urgent">3 天内截止</button>
        </div>
      </section>

      <section class="panel">
        <h3>大作业</h3>
        <div id="major-mini" class="major-mini"></div>
      </section>

      <section class="panel">
        <h3>同学</h3>
        <div id="member-list" class="members"></div>
      </section>

      <section class="panel">
        <h3>数据</h3>
        <div class="row-btns">
          <button id="btn-export" class="btn btn-sm">导出备份</button>
          <button id="btn-import" class="btn btn-sm">导入备份</button>
          <input id="file-import" type="file" accept="application/json" hidden>
        </div>
        <p id="storage-hint" class="hint"></p>
      </section>
    </aside>

    <!-- 主内容 -->
    <main id="main" class="main">
      <section id="view-grid" class="view">
        <div id="weeks" class="weeks"></div>
      </section>

      <section id="view-list" class="view" hidden>
        <div id="list-body" class="list-body"></div>
      </section>

      <section id="view-timetable" class="view" hidden>
        <div id="timetable" class="timetable"></div>
      </section>
    </main>
  </div>
</div>

<!-- ================= 通用弹窗 ================= -->
<div id="modal" class="modal" hidden>
  <div class="modal-backdrop" data-close="1"></div>
  <div class="modal-card" role="dialog" aria-modal="true">
    <header class="modal-head">
      <h2 id="modal-title">标题</h2>
      <button id="modal-close" class="btn btn-ghost" title="关闭">✕</button>
    </header>
    <div id="modal-body" class="modal-body"></div>
    <footer id="modal-foot" class="modal-foot"></footer>
  </div>
</div>

<div id="lightbox" class="lightbox" hidden>
  <img id="lightbox-img" alt="">
</div>

<div id="toasts" class="toasts"></div>

<script src="js/util.js"></script>
<script src="js/api.js"></script>
<script src="js/store.js"></script>
<script src="js/render.js"></script>
<script src="js/modals.js"></script>
<script src="js/app.js"></script>
</body>
</html>
